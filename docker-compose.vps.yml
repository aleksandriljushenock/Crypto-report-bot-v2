services:
  crypto-bot:
    build:
      context: .
      dockerfile: Dockerfile.vps
    container_name: crypto-report-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
      TZ: ${TZ:-Europe/Minsk}
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    stop_grace_period: 45s
