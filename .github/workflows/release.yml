name: Release artifact
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/agent_audit.py --strict
      - run: python scripts/build_release.py "dist/Crypto-report-bot-${GITHUB_REF_NAME}.zip"
      - run: sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
