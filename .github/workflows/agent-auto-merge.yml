name: Guarded agent auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
# Protected: .github/workflows, docker-compose, Dockerfile, migrations, execution_model_v57.py, paper_trading.py, cloud_model_store.py
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Merge only internal, labeled, non-protected agent PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const sha=context.payload.workflow_run.head_sha;
            const {data:prs}=await github.rest.repos.listPullRequestsAssociatedWithCommit({owner,repo,commit_sha:sha});
            for (const pr of prs.filter(p=>p.state==='open')) {
              const labels=(pr.labels||[]).map(l=>l.name);
              if (!labels.includes('agent-auto-merge')) continue;
              if (pr.head.repo.full_name !== `${owner}/${repo}`) continue;
              if (!pr.head.ref.startsWith('agent/')) continue;
              const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:pr.number,per_page:100});
              const protectedRe=/^(\.github\/workflows\/|docker-compose|Dockerfile|migrations\/|.*\.sql$|execution_model_v57\.py$|paper_trading\.py$|cloud_model_store\.py$)/;
              const blocked=files.filter(f=>protectedRe.test(f.filename)).map(f=>f.filename);
              if (blocked.length) {
                core.warning(`PR #${pr.number} requires manual review: ${blocked.join(', ')}`);
                continue;
              }
              await github.rest.pulls.merge({owner,repo,pull_number:pr.number,merge_method:'squash'});
            }
