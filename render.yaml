services:
  - type: web
    name: crypto-report-bot
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 1 --timeout 0 --bind 0.0.0.0:$PORT render_app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "600"
      - key: KEEPALIVE_INITIAL_DELAY_SECONDS
        value: "60"
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: LOG_DIR
        value: /opt/render/project/src/logs
      - key: LOG_LEVEL
        value: INFO
      - key: TZ
        value: Europe/Minsk
      - key: ENABLED_EXCHANGES
        value: binance,mexc,bybit,okx,kucoin,gate,bitget
      - key: EXCHANGE_QUOTES
        value: USDT,USDC
      - key: TRADE_SCAN_MAX_WORKERS
        value: "1"
      - key: TRADE_TOP_LIQUID_SYMBOLS
        value: "16"
      - key: LEARNING_SEARCH_ITERATIONS
        value: "40"
      - key: LEARNING_CLOUD_RESTORE_ENABLED
        value: "true"
      - key: LEARNING_CLOUD_MAX_ROWS
        value: "750"
      - key: MEMORY_SOFT_LIMIT_MB
        value: "340"
      - key: MEMORY_HARD_LIMIT_MB
        value: "470"
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: HEDGE_CANDIDATE_POOL
        value: "10"
      - key: CHRONOS_MODE
        value: subprocess
      - key: CHRONOS_FINALISTS
        value: "1"
      - key: CHRONOS_CONTEXT_LENGTH
        value: "96"
      - key: CHRONOS_PREDICTION_LENGTH
        value: "6"
      - key: CHRONOS_TORCH_THREADS
        value: "1"
      - key: CHRONOS_REQUIRED_HEADROOM_MB
        value: "220"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"

